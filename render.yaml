services:
  - type: web
    name: webautomatizaciones
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # ⚠️  Las siguientes variables deben configurarse manualmente en Render Dashboard
      - key: OMNIROUTE_URL
        sync: false
      - key: OMNIROUTE_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: CONTACT_EMAIL
        sync: false
