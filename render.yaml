services:
  - type: web
    name: webautomatizaciones
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # ⚠️  Las siguientes variables deben configurarse manualmente en Render Dashboard
      - key: AI_API_URL
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: CHAT_MODEL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CONTACT_EMAIL
        sync: false
